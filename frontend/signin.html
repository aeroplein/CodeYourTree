<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Back | CodeYourTree</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/login.css">
</head>

<body>
    <div class="auth-card">
        <div class="auth-header">
            <h2>Welcome Back</h2>
            <p>Log in to tend to your tree.</p>
        </div>
        <form action="" id="login-form">
            <div class="form-group">
                <label for="username-input">Username</label>
                <input type="text" id="username-input" class="form-control" placeholder="e.g. dev_john" required>
            </div>
            <div class="form-group">
                <label for="password-input">Password</label>
                <input type="password" id="password-input" class="form-control" placeholder="Password" required>
            </div>
            <button type="submit" class="btn-auth" id="login-btn">Login</button>
        </form>

        <div class="auth-footer">Don't have a tree yet?
            <a href="signup.html">Join the Garden</a>
        </div>
        <div id="toast"></div>
    </div>
    
    <script src="js/signin.js"></script>
</body>

</html>
